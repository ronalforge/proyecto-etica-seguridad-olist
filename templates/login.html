<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>Ingresar · Olist Lab</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body class="login-page"><main class="login-shell"><div class="login-brand">{% include '_brand_icon.html' %}<span>Olist <span class="identity-muted">Lab</span></span></div><section class="login-card" aria-labelledby="login-title"><p class="overline">Acceso restringido</p><h1 id="login-title">Bienvenido de nuevo</h1><p>Ingresa para consultar los indicadores de entregas.</p>{% if error %}<div class="form-error" role="alert">{{ error }}</div>{% endif %}<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label for="username">Usuario</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="button button-primary login-button" type="submit">Ingresar al panel</button></form></section><p class="login-footnote">Proyecto académico · Ética y seguridad de datos</p></main></body></html>
