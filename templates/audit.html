<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Auditoría · Olist</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><header><div class="brand">OLIST <span>· LAB</span></div><a href="{{ url_for('dashboard') }}">Volver al panel</a></header><main><div class="eyebrow">SOLO ADMINISTRADORES</div><h1>Registro de auditoría</h1><p class="note">Últimos 100 eventos. Las contraseñas no se registran.</p><article class="panel"><table><thead><tr><th>Fecha UTC</th><th>Usuario</th><th>Acción</th></tr></thead><tbody>{% for row in entries %}<tr><td>{{ row.at }}</td><td>{{ row.username or '—' }}</td><td>{{ row.action }}</td></tr>{% endfor %}</tbody></table></article></main></body></html>
